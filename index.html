<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
     <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My science Lab</h1>
            <p class="lead">Welcome to the lab! Here experiment running</p>
            <button class="btn btn-primary">Chemistry</button>
            <button class="btn btn-success">Biology</button>
            <button class="btn btn-warning">Physics</button>
            <button class="btn btn-danger">Astronomy</button>
        </div>
     </div>
     <div class="container">
        <h2 class="section-title">Experiment 
            completed<span class="badge bg-danger">4</span></h2>
        <p>Chemsitry <span class="badge bg-primary">7 experiment</span></p>
        <p>Biology <span class="badge bg-success">5 experiment</span></p>
        <p>Physics <span class="badge bg-warning">4 experiment</span></p>
        <p>Astronomy <span class="badge bg-danger">3 experiment</span></p>
        <h2 class="section-title">Research Progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width:85%">85%</div>
     </div>
      <p>Biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width:75%">75%</div>
     </div>
      <p>Physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width:65%">65%</div>
     </div>
      <p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width:45%">45%</div>
     </div>
</body>
</html>
